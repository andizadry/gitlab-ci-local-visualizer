<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e2333" /><stop offset="60%" stop-color="#121520" /><stop offset="100%" stop-color="#090b10" />
    </radialGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC6D26" /><stop offset="50%" stop-color="#6B46C1" /><stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="glO" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF7835" /><stop offset="100%" stop-color="#E24329" /></linearGradient>
    <linearGradient id="glY" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FCA326" /><stop offset="100%" stop-color="#FC6D26" /></linearGradient>
    <linearGradient id="glD" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#E24329" /><stop offset="100%" stop-color="#A52610" /></linearGradient>
    <linearGradient id="glass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="rgba(0,210,255,0.4)" /><stop offset="50%" stop-color="rgba(110,73,255,0.2)" /><stop offset="100%" stop-color="rgba(0,229,255,0.1)" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f2fe" /><stop offset="50%" stop-color="#4facfe" /><stop offset="100%" stop-color="#7028e4" /></linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4facfe" /><stop offset="40%" stop-color="#243048" /><stop offset="100%" stop-color="#0f1422" /></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6" /></filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="url(#border)" stroke-width="6" />

  <!-- Pipeline Track -->
  <g opacity="0.75">
    <path d="M 60 350 L 170 350 L 220 400 L 300 400" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8,8" />
    <path d="M 60 350 L 170 350" fill="none" stroke="#00D2FF" stroke-width="6" filter="url(#glow)" />
    <circle cx="60" cy="350" r="14" fill="#141724" stroke="#00D2FF" stroke-width="4" /><circle cx="60" cy="350" r="6" fill="#00E5FF" />
    <circle cx="170" cy="350" r="14" fill="#141724" stroke="#FC6D26" stroke-width="4" /><circle cx="170" cy="350" r="6" fill="#FCA326" />
  </g>

  <!-- GitLab Logo -->
  <g transform="translate(230, 180) scale(0.95)" filter="url(#glow)">
    <polygon points="0,55 -38,-50 38,-50" fill="url(#glD)" />
    <polygon points="0,55 -38,-50 -95,-50" fill="url(#glO)" />
    <polygon points="0,55 38,-50 95,-50" fill="url(#glO)" />
    <polygon points="-95,-50 -120,30 0,55" fill="url(#glY)" />
    <polygon points="95,-50 120,30 0,55" fill="url(#glY)" />
    <polygon points="-95,-50 -38,-50 -66,-115" fill="url(#glO)" />
    <polygon points="95,-50 38,-50 66,-115" fill="url(#glO)" />
  </g>

  <!-- LOCAL CI Badge -->
  <g transform="translate(52, 52)">
    <rect x="0" y="0" width="138" height="38" rx="10" fill="#101420" stroke="#00D2FF" stroke-width="2.5" />
    <circle cx="18" cy="19" r="5" fill="#00FF88" filter="url(#glow)" />
    <text x="32" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#00D2FF">LOCAL</text>
    <text x="96" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#FF7835">CI</text>
  </g>

  <!-- Magnifying Glass Inspector -->
  <g transform="translate(305, 305)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#rim)" stroke-width="14" />
    <circle cx="0" cy="0" r="112" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.5" filter="url(#glow)" />
    <circle cx="0" cy="0" r="98" fill="url(#glass)" />
    
    <!-- Inside Lens -->
    <g transform="scale(1.1)">
      <path d="M -45 -10 L -5 -10 L 25 18 L 45 18" fill="none" stroke="#00ffff" stroke-width="4" filter="url(#glow)" />
      <rect x="-60" y="-22" width="24" height="24" rx="6" fill="#0f172a" stroke="#00E5FF" stroke-width="2.5" />
      <path d="M -53 -10 L -49 -6 L -41 -14" fill="none" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="-16" y="-22" width="24" height="24" rx="6" fill="#2d1607" stroke="#FC6D26" stroke-width="2.5" />
      <circle cx="-4" cy="-10" r="4" fill="#FC6D26" />
      <rect x="22" y="6" width="24" height="24" rx="6" fill="#1b1233" stroke="#9d4edd" stroke-width="2.5" />
      <circle cx="34" cy="18" r="4" fill="#c77dff" />
      <text x="-40" y="44" font-family="monospace" font-weight="900" font-size="16" fill="#00D2FF">{ YAML }</text>
    </g>

    <!-- Glass Reflection -->
    <path d="M -65 -45 A 80 80 0 0 1 45 -65 A 65 65 0 0 0 -45 -20 Z" fill="#fff" opacity="0.3" />

    <!-- Handle -->
    <g transform="rotate(45, 0, 0)">
      <rect x="-14" y="99" width="28" height="20" rx="4" fill="#00f2fe" stroke="#4facfe" stroke-width="2" />
      <path d="M -11 119 L 11 119 L 15 220 C 15 230 -15 230 -15 220 Z" fill="url(#handle)" stroke="#4facfe" stroke-width="3" />
      <line x1="-8" y1="150" x2="8" y2="150" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <line x1="-8" y1="170" x2="8" y2="170" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>

  <!-- Author Tag -->
  <text x="52" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#64748b" letter-spacing="1">BY ANDIZADRY</text>
</svg>
