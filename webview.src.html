        // =====================================================================
        // v2.0.0 #2 — Rules Trace UI (step-by-step evaluasi rules dari simulator)
        // =====================================================================
        function renderRulesTraceSection(job, scope) {
            const host = document.getElementById('drawerTraceSection');
            if (!host) return;
            host.innerHTML = '';
            const name = job && job.job_name;
            const pool = scope ? ((childSimByPath[scope.path] || {}).results || null) : lastSimResults;
            const res = (name && pool && pool[name]) ? pool[name] : null;
            const trace = res && Array.isArray(res.trace) ? res.trace : null;
            if (!res) {
                host.innerHTML = '<div class="section-title">Rules Trace</div>' +
                    '<div style="opacity:0.6;font-size:12px;">' + escapeHtml(L('Jalankan simulasi (Panel Skenario) untuk melihat evaluasi rules langkah demi langkah.')) + '</div>';
                return;
            }
            const statusTxt = res.error ? ('ERROR: ' + res.error) : (String(res.status || '') + (res.when_effective ? ' (when: ' + res.when_effective + ')' : ''));
            let html = '<div class="section-title">Rules Trace</div>';
            html += '<div style="font-size:12px;margin-bottom:6px;">' + escapeHtml(L('Hasil: ')) + '<strong>' + escapeHtml(statusTxt) + '</strong></div>';
            if (res.reason) {
                html += '<div style="font-size:11px;opacity:0.8;margin-bottom:6px;">' + escapeHtml(String(res.reason)) + '</div>';
            }
            if (!trace || !trace.length) {
                html += '<div style="opacity:0.6;font-size:12px;">' + escapeHtml(L('(Tidak ada rules eksplisit untuk job ini)')) + '</div>';
                host.innerHTML = html;
                return;
            }
            html += '<div class="trace-list">';
            trace.forEach(function (t) {
                const eff = t.effective ? ' trace-effective' : '';
                const reached = t.reached === false ? ' trace-unreached' : '';
                const mark = t.effective ? '\u2705' : (t.matched ? '\u2611' : '\u2717');
                html += '<div class="trace-item' + eff + reached + '">';
                html += '<div class="trace-head">' + mark + ' rule[' + t.index + ']' +
                    (t.when ? ' <span class="trace-when">when: ' + escapeHtml(String(t.when)) + '</span>' : '') +
                    (t.effective ? ' <span class="trace-badge">EFFECTIVE</span>' : '') +
                    (t.reached === false ? ' <span class="trace-badge trace-skip">not reached</span>' : '') +
                    '</div>';
                const clauses = Array.isArray(t.clauses) ? t.clauses : [];
                clauses.forEach(function (c) {
                    if (c.clause === 'none') {
                        html += '<div class="trace-clause">\u2192 no condition (always match)</div>';
                        return;
                    }
                    const ok = c.result ? '\u2713' : '\u2717';
                    let expr = c.expr;
                    if (Array.isArray(expr)) expr = expr.join(', ');
                    else if (expr === null || expr === undefined) expr = '';
                    html += '<div class="trace-clause">' + ok + ' <em>' + escapeHtml(c.clause) + '</em>: <code>' +
                        escapeHtml(String(expr)) + '</code>' +
                        (c.error ? ' <span class="trace-err">(' + escapeHtml(String(c.error)) + ')</span>' : '') +
                        '</div>';
                });
                html += '</div>';
            });
            html += '</div>';
            host.innerHTML = html;
        }

        // =====================================================================
        // v2.0.0 #7b — Copy Resolved Job: merge extends + variables -> YAML-ish
        // =====================================================================
        function resolveJobYaml(job) {
            // Utamakan definisi efektif dari engine (extends + !reference + default sudah digabung).
            if (job && job.resolved_definition && typeof job.resolved_definition === 'object') {
                const resolved = JSON.parse(JSON.stringify(job.resolved_definition));
                delete resolved.extends;
                return toYamlish(job.job_name || 'job', resolved);
            }
            // Fallback (data lama): gabungkan definisi efektif: base dari extends (dangkal) lalu override job.
            const out = {};
            function shallowMerge(target, srcObj) {
                if (!srcObj || typeof srcObj !== 'object') return;
                Object.keys(srcObj).forEach(function (k) {
                    const v = srcObj[k];
                    if (v && typeof v === 'object' && !Array.isArray(v) &&
                        target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
                        shallowMerge(target[k], v);
                    } else {
                        target[k] = v;
                    }
                });
            }
            // Terapkan definisi tiap parent extends (bila tersedia definisinya).
            const extInfo = Array.isArray(job.extends_info) ? job.extends_info : [];
            extInfo.forEach(function (ext) {
                if (ext && ext.definition && typeof ext.definition === 'object') {
                    shallowMerge(out, ext.definition);
                }
            });
            // Definisi job sendiri menang.
            if (job.definition && typeof job.definition === 'object') {
                shallowMerge(out, job.definition);
            }
            // Pastikan variables efektif tergabung.
            if (job.variables && Object.keys(job.variables).length) {
                out.variables = Object.assign({}, out.variables || {}, job.variables);
            }
            // 'extends' key tidak relevan lagi pada bentuk resolved.
            delete out.extends;
            return toYamlish(job.job_name || 'job', out);
        }

        function toYamlish(rootName, obj) {
            const lines = [];
            function emit(val, indent) {
                const pad = '  '.repeat(indent);
                if (Array.isArray(val)) {
                    val.forEach(function (item) {
                        if (item && typeof item === 'object') {
                            lines.push(pad + '-');
                            emit(item, indent + 1);
                        } else {
                            lines.push(pad + '- ' + scalar(item));
                        }
                    });
                } else if (val && typeof val === 'object') {
                    Object.keys(val).forEach(function (k) {
                        const v = val[k];
                        if (v && typeof v === 'object' && Object.keys(v).length) {
                            lines.push(pad + k + ':');
                            emit(v, indent + 1);
                        } else if (v && typeof v === 'object') {
                            lines.push(pad + k + ': ' + (Array.isArray(v) ? '[]' : '{}'));
                        } else {
                            lines.push(pad + k + ': ' + scalar(v));
                        }
                    });
                } else {
                    lines.push(pad + scalar(val));
                }
            }
            function scalar(v) {
                if (v === null || v === undefined) return 'null';
                if (typeof v === 'string') {
                    if (v === '' || /[:#\-\{\}\[\]&*!|>'"%@`]/.test(v) || /^\s|\s$/.test(v)) {
                        return JSON.stringify(v);
                    }
                    return v;
                }
                return String(v);
            }
            lines.push(rootName + ':');
            emit(obj, 1);
            return lines.join('\n');
        }

        function wireCopyResolvedButton(job) {
            const btn = document.getElementById('copyResolvedBtn');
            if (!btn) return;
            btn.onclick = function () {
                let text = '';
                try { text = resolveJobYaml(job); }
                catch (e) { text = L('# gagal resolve: {0}', e.message); }
                const done = function () {
                    const old = btn.textContent;
                    btn.textContent = '\u2714 Copied!';
                    setTimeout(function () { btn.textContent = old; }, 1500);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, function () {
                        vscode.postMessage({ command: 'copyText', text: text }); done();
                    });
                } else {
                    vscode.postMessage({ command: 'copyText', text: text }); done();
                }
            };
        }

        /**
         * Bangun satu chip relasi (extends/needs) yang dapat diklik ke Source_Location target.
         * Req 4.4/4.5 (multi-target = beberapa chip); Req 4.6 (tanpa Source_Location → nonaktif);
         * Req 4.7 (ada path tanpa line valid → line 1, ditangani buildOpenFileMsg/openFileInEditor).
         */
        function buildRelationChip(kind, name, sourceFile, lineNumber) {
            const chip = document.createElement('span');
            const label = (name === null || name === undefined) ? '(unknown)' : String(name);
            if (sourceFile) {
                chip.className = 'rel-chip ' + kind + ' clickable';
                chip.textContent = label;
                chip.onclick = () => openFileInEditor(sourceFile, lineNumber);
            } else {
                chip.className = 'rel-chip ' + kind + ' disabled';
                chip.textContent = label;
                chip.title = L('Tidak ada lokasi sumber untuk target ini');
            }
            return chip;
        }

        // =====================================================================
        // Task 12.5 — Error node drawer (status + open-file gating)
        // =====================================================================

        function openErrorNodeDrawer(node) {
            document.getElementById('drawerJobTitle').textContent = node.label || node.id || 'Error File';
            const body = document.getElementById('drawerJobBody');

            // Req 7.2/7.3 — tampilkan status; kosong → "status tidak tersedia".
            const hasStatus = node.status !== undefined && node.status !== null && String(node.status).trim() !== '';
            const statusHtml = hasStatus
                ? '<div class="status-value" style="color:#ef9a9a;">' + escapeHtml(node.status) + '</div>'
                : '<div class="status-unavailable">' + escapeHtml(L('status tidak tersedia')) + '</div>';

            // Req 7.4 — tanpa path → nonaktifkan aksi buka file + indikasi.
            const hasPath = !!node.path;
            const btnHtml = hasPath
                ? '<button class="open-file-btn" id="openSourceFileBtn">📂 Open Source File in VS Code</button>'
                : '<button class="open-file-btn" id="openSourceFileBtn" disabled>📂 Open Source File (unavailable)</button>' +
                  '<div class="open-file-note">' + escapeHtml(L('Aksi buka file tidak tersedia: node ini tidak memiliki path ke file yang ada.')) + '</div>';

            body.innerHTML =
                btnHtml +
                '<div>' +
                    '<div class="section-title">Type</div>' +
                    '<div>' + escapeHtml(node.type) + '</div>' +
                '</div>' +
                '<div>' +
                    '<div class="section-title">Status</div>' +
                    statusHtml +
                '</div>' +
                (node.path ? ('<div><div class="section-title">Path</div><div class="file-path">' + escapeHtml(node.path) + '</div></div>') : '') +
                '<div id="drawerNeighborsSection"></div>';

            const btn = document.getElementById('openSourceFileBtn');
            if (btn && hasPath) {
                btn.onclick = () => openFileInEditor(node.path, node.line_number);
            }

            const nHost = document.getElementById('drawerNeighborsSection');
            if (nHost) {
                nHost.innerHTML = '';
                nHost.appendChild(renderNeighborsSection(node.id));
            }

            document.getElementById('drawerOverlay').classList.add('open');
            document.getElementById('jobDrawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('jobDrawer').classList.remove('open');
        }

        // =====================================================================
        // Task 17 — Pipeline Rules Simulator: Panel Skenario + message wiring
        // =====================================================================

        function setupSimPanel() {
            const simPanelEl = document.getElementById('simPanel');
            if (!simPanelEl) return;
            if (!CIViz || typeof CIViz.createSimUI !== 'function') {
                simPanelEl.innerHTML = '';
                return; // bundle simUI tak tersedia — panel dilewati tanpa mengganggu graf.
            }
            sim = CIViz.createSimUI(simPanelEl, {
                doc: document, vscode: vscode, graphView: graphView,
                // Mode Simulasi dimatikan / simulasi gagal: bersihkan label status di semua tampilan.
                onClear: function () {
                    lastSimResults = null;
                    if (viewMode === 'standard') applyStandardSimBadges(null);
                    indexChildSims(null);
                    renderDownstream();
                }
            });
            sim.render(ciData);
        }

        // Terima hasil simulasi dari host (Req 12/13/14/8.6).
        window.addEventListener('message', (e) => {
            if (e && e.data && e.data.command === 'simulationResult') {
                if (sim && typeof sim.onSimulationResult === 'function') {
                    sim.onSimulationResult(e.data);
                }
                lastSimResults = (e.data && e.data.results) ? e.data.results : null;
                if (viewMode === 'standard') {
                    applyStandardSimBadges(lastSimResults);
                }
                // Pipeline downstream (child / multi-project / dynamic): simpan hasil & perbarui tampilan.
                indexChildSims(e.data && !e.data.error ? e.data.child_pipelines : null);
                renderDownstream();
                applyChildBadgesToGraph();
            } else if (e && e.data && e.data.command === 'simulationMatrixResult') {
                // v2.0.0 #3 — hasil matrix diteruskan ke simUI.
                if (sim && typeof sim.onMatrixResult === 'function') {
                    sim.onMatrixResult(e.data);
                }
            } else if (e && e.data && e.data.command === 'focusJob') {
                handleFocusJob(e.data.job);
            }
        });

        // Fokus ke job tertentu (dipanggil dari CodeLens via extension.js).
        function handleFocusJob(jobName) {
            if (!jobName) return;
            const job = (ciData.jobs || {})[jobName];
            if (viewMode === 'detail') {
                if (graphView && typeof graphView.focusNode === 'function') {
                    graphView.focusNode('job:' + jobName);
                }
                if (job) openJobDrawer(job);
            } else {
                if (job) openJobDrawer(job);
            }
        }

        // Wire tombol mode switch.
        const _modeStdBtn = document.getElementById('modeStandardBtn');
        const _modeDetBtn = document.getElementById('modeDetailBtn');
        if (_modeStdBtn) _modeStdBtn.onclick = () => setViewMode('standard');
        if (_modeDetBtn) _modeDetBtn.onclick = () => setViewMode('detail');

        buildChildIndex();
        renderHeader();
        // Panel Skenario harus tersedia di kedua mode (tidak bergantung graf).
        setupSimPanel();

        // Task #4: restore state tersimpan (mode, layout, filter, skenario, search).
        const _persisted = loadPersistedState();
        const _initialMode = (_persisted && _persisted.viewMode === 'detail') ? 'detail' : 'standard';
        if (_persisted && _persisted.search) {
            const sb = document.getElementById('searchJobs');
            if (sb) sb.value = _persisted.search;
        }
        setViewMode(_initialMode);
        // Sinkronkan label tombol layout bila state tersimpan TB (restore aktual dilakukan
        // di renderGraph saat graphView dibuat, agar konsisten baik mode awal standard/detail).
        if (_persisted && _persisted.layoutDir === 'TB') {
            const _db = document.getElementById('layoutDirBtn');
            if (_db) _db.textContent = '⇅ TB';
        }
        renderFiles();
        renderMergedYaml();
        // Simpan state ketika akan ditutup/hidden.
        window.addEventListener('beforeunload', function () { try { persistState(); } catch (e) {} });
    </script>
</body>
</html>
