  function requestMatrix() {
    if (!(vscode && typeof vscode.postMessage === 'function')) {

    const base = getScenario();
    const scenarios = PRESET_NAMES.map(function (presetName) {

  function onMatrixResult(msg) {

    const jobSet = {};
    columns.forEach(function (col) {
      const res = col && col.results && typeof col.results === 'object' ? col.results : {};
      Object.keys(res).forEach(function (n) { jobSet[n] = true; });

    const jobs = Object.keys(jobSet).sort();
    if (!jobs.length) {
      matrixEl.appendChild(el('div', { class: 'sim-diff-note' }, L('Tidak ada job pada hasil matrix.')));
      return;
    }

    const table = el('table', { class: 'sim-matrix-table' });
    const thead = el('thead');
    const hrow = el('tr');
    hrow.appendChild(el('th', { class: 'sim-matrix-jobcol' }, 'Job'));
    columns.forEach(function (col) {
      const blocked = col && col.pipeline_created === false;
      const th = el('th', { title: col && col.error ? String(col.error) : '' },
        String(col && col.label ? col.label : '?') + (blocked ? ' \u26D4' : ''));
      hrow.appendChild(th);

    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody = el('tbody');
    jobs.forEach(function (job) {
      const tr = el('tr');
      tr.appendChild(el('td', { class: 'sim-matrix-jobcol' }, job));
      columns.forEach(function (col) {
        const res = col && col.results && typeof col.results === 'object' ? col.results : {};
        let status;

        const td = el('td', { class: 'sim-matrix-cell sim-status-' + status }, status);
        tr.appendChild(td);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    matrixEl.appendChild(table);
  }

  // via opsi saat pembuatannya. simUI juga menyediakan callback publik untuk itu.

  return {

    takeSnapshot,

    isSimMode: function () { return simMode; },
    getLastResults: function () { return lastResults; },
    getSnapshot: function () { return snapshotResults; },
    showDetail,
    // callback untuk GraphView.onSimSelect (nodeId sudah di-strip jadi jobName oleh GraphView).
    onNodeSimSelect: function (jobName, result) { showDetail(jobName, result); },

            // Task 17 — Panel Skenario (Pipeline Rules Simulator).
            setupSimPanel();

            try {
                if (_persisted && _persisted.scenario && sim && typeof sim.setScenario === 'function') {

            // EdgeFilterBar diturunkan dari model (Req 2.1, 2.6, 2.7).
            renderEdgeFilterBar(model);

            try {
                if (_persisted && Array.isArray(_persisted.enabledTypes)) {

                    if (bar) {
                        bar.querySelectorAll('input[data-filter-type]').forEach(cb => {
                            if (!cb.disabled) cb.checked = saved.has(cb.getAttribute('data-filter-type'));

                    onEdgeFilterChange();

        function renderEdgeFilterBar(model) {
            const bar = document.getElementById('edgeFilterBar');
            if (!bar) return;
            bar.innerHTML = '';

            const title = document.createElement('span');
            title.className = 'filter-title';
            title.textContent = 'Relations';
            bar.appendChild(title);

            const filters = (CIViz && typeof CIViz.deriveFilters === 'function')
                ? CIViz.deriveFilters(model) : [];

            // Set awal: semua tipe aktif (Req 2.6).
            currentEnabledTypes = (CIViz && typeof CIViz.initialEnabledTypes === 'function')
                ? CIViz.initialEnabledTypes() : new Set(filters.map(f => f.type));

            filters.forEach(f => {
                const label = document.createElement('label');
                label.className = 'edge-filter' + (f.interactive ? '' : ' disabled');
                label.setAttribute('data-edge-type', f.type);

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = !!f.enabled;           // default checked (Req 2.6).
                cb.disabled = !f.interactive;       // tipe tanpa edge → disabled (Req 2.7).
                cb.setAttribute('data-filter-type', f.type);

                const swatch = document.createElement('span');
                swatch.className = 'filter-swatch';
                let style = null;
                if (CIViz && typeof CIViz.styleForEdgeType === 'function') {
                    style = CIViz.styleForEdgeType(f.type);
                }
                swatch.style.background = style ? style.color : '#888';

                const text = document.createElement('span');
                text.textContent = f.type;

                const count = document.createElement('span');
                count.className = 'filter-count';
                count.textContent = '(' + f.count + ')';

                cb.addEventListener('change', () => onEdgeFilterChange());

                label.appendChild(cb);
                label.appendChild(swatch);
                label.appendChild(text);
                label.appendChild(count);
                bar.appendChild(label);
            });
        }

        function onEdgeFilterChange() {
            const bar = document.getElementById('edgeFilterBar');
            if (!bar || !graphView) return;
            const set = new Set();
            bar.querySelectorAll('input[data-filter-type]').forEach(cb => {
                if (cb.checked) set.add(cb.getAttribute('data-filter-type'));
            });
            currentEnabledTypes = set;
            graphView.setVisibleEdgeTypes(set);
        }

        function onGraphSelect(nodeId) {
            // Node terpilih → buka drawer info (job atau node umum). (Task E)
            if (!nodeId) { return; }
            if (nodeId.indexOf('cjob:') === 0 && childJobById[nodeId]) {
                openJobDrawer(childJobById[nodeId].job, childJobById[nodeId].meta);
                return;
            }
            if (nodeId.indexOf('child:') === 0 && childIndexByPath[nodeId.slice(6)]) {
                openChildDrawer(childIndexByPath[nodeId.slice(6)]);
                return;
            }
            if (nodeId.indexOf('job:') === 0) {
                const name = nodeId.slice(4);
                const job = (ciData.jobs || {})[name];
                if (job) { openJobDrawer(job); return; }
            }
            const node = findGraphNode(nodeId);
            if (node) {
                openErrorNodeDrawer(node);
            }
        }

        function findGraphNode(nodeId) {
            const g = ciData.deep_graph;
            if (!g || !Array.isArray(g.nodes)) return null;
            for (const n of g.nodes) {
                if (n && n.id === nodeId) return n;
            }
            return null;
        }

        // Task #7: export PNG (render SVG ke canvas lalu unduh via data URL).
        function exportGraphPng() {
            const svg = document.querySelector('#graphContainer svg');
            if (!svg) return;
            try {
                const xml = new XMLSerializer().serializeToString(svg);
                const svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
                const img = new Image();
                img.onload = function () {
                    const cw = (graphView && graphView.getContentSize) ? graphView.getContentSize().width : (svg.clientWidth || 1200);
                    const ch = (graphView && graphView.getContentSize) ? graphView.getContentSize().height : (svg.clientHeight || 800);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(200, cw); canvas.height = Math.max(200, ch);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const png = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = png; a.download = 'gitlab-ci-graph.png';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };
                img.onerror = function () { try { alert(L('Gagal render PNG')); } catch(e){} };
                img.src = svg64;
            } catch (e) {
                try { alert(L('Export PNG gagal: {0}', e.message)); } catch(_){}
            }
        }

        function renderStandard() {
            const container = document.getElementById('standardContainer');
            if (!container) return;
            container.innerHTML = '';

            const jobs = ciData.jobs || {};
            const jobNames = Object.keys(jobs);
            if (!jobNames.length) {
                const empty = document.createElement('div');
                empty.className = 'graph-message';
                empty.textContent = L('Tidak ada job untuk ditampilkan.');
                container.appendChild(empty);
                return;
            }

            const stages = Array.isArray(ciData.stages) ? ciData.stages.slice() : [];
            const stageSet = new Set(stages);

            // Kelompokkan job per stage; job tanpa stage yang cocok → kolom 'other'.
            const byStage = {};
            stages.forEach(s => { byStage[s] = []; });
            let hasOther = false;
            jobNames.forEach(name => {
                const job = jobs[name];
                let st = job && job.stage ? job.stage : 'test';
                if (!stageSet.has(st)) {
                    st = 'other';
                    hasOther = true;
                }
                if (!byStage[st]) byStage[st] = [];
                byStage[st].push(job);
            });

            const columns = stages.slice();
            if (hasOther) columns.push('other');

            columns.forEach(stage => {
                const jobsInStage = byStage[stage] || [];
                const col = document.createElement('div');
                col.className = 'stage-column';

                const header = document.createElement('div');
                header.className = 'stage-header';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = stage;
                const badge = document.createElement('span');
                badge.className = 'stage-badge';
                badge.textContent = String(jobsInStage.length);
                header.appendChild(nameSpan);
                header.appendChild(badge);
                col.appendChild(header);

                const list = document.createElement('div');
                list.className = 'job-list';

                jobsInStage.forEach(job => {
                    list.appendChild(buildStandardJobCard(job));
                });

                col.appendChild(list);
                container.appendChild(col);
            });

            // Terapkan ulang label status simulasi bila ada hasil terakhir.
            if (lastSimResults) {
                applyStandardSimBadges(lastSimResults);
            }

        function basename(p) {
            if (!p) return '';
            const s = String(p);
            const idx = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
            return idx >= 0 ? s.slice(idx + 1) : s;
        }

        function buildStandardJobCard(job) {
            const card = document.createElement('div');

            const jobName = job.job_name || '';
            card.dataset.jobName = String(jobName).toLowerCase();
            card.dataset.tags = (Array.isArray(job.tags) ? job.tags.join(',') : '').toLowerCase();

            const title = document.createElement('div');
            title.className = 'job-title';
            title.textContent = jobName;
            card.appendChild(title);

            const meta = document.createElement('div');
            meta.className = 'job-meta';
            if (job.extends) {
                const list = Array.isArray(job.extends) ? job.extends : [job.extends];
                list.forEach(ext => {
                    const b = document.createElement('span');
                    b.className = 'badge extends';
                    b.textContent = '⬆ ' + ext;
                    meta.appendChild(b);
                });
            }
            if (Array.isArray(job.tags) && job.tags.length) {
                job.tags.forEach(tag => {
                    const b = document.createElement('span');
                    b.className = 'badge tag';
                    b.textContent = '🏷 ' + tag;
                    meta.appendChild(b);
                });
            }
            if (job.when === 'manual') {
                const b = document.createElement('span');
                b.className = 'badge manual';
                b.textContent = 'manual';
                meta.appendChild(b);
            }
            const downstream = childTree()[jobName];
            if (downstream) {

                b.className = 'badge manual';
                b.textContent = '⤷ ' + childKindLabel(downstream);
                b.title = 'Bridge job: memicu pipeline downstream';

            if (job.parallel_info && job.parallel_info.count) {
                const b = document.createElement('span');

                b.textContent = '×' + job.parallel_info.count;
                b.title = 'parallel: ' + job.parallel_info.count + ' instance';
                meta.appendChild(b);
            }
            if (meta.childNodes.length) card.appendChild(meta);

            if (job.source_file) {
                const src = document.createElement('div');
                src.className = 'job-source';
                src.textContent = basename(job.source_file);
                card.appendChild(src);
            }

            card.onclick = () => openJobDrawer(job);

        /**
         * applyStandardSimBadges(results) — labeli kartu job mode Standar dengan status simulasi.
         * results null → bersihkan badge/border.
         */
        function applyStandardSimBadges(results) {
            const cards = document.querySelectorAll('#standardContainer .job-card[data-job-name]');
            const jobs = ciData.jobs || {};
            cards.forEach(card => {
                // Hapus badge lama & reset border tiap kali.
                const old = card.querySelector('.sim-status-badge');
                if (old) old.remove();
                card.style.borderLeft = '';

                if (!results) return;

                // Cocokkan nama asli (bukan lowercase dataset).
                const lower = card.dataset.jobName;
                let realName = null;
                for (const n of Object.keys(jobs)) {
                    if (n.toLowerCase() === lower) { realName = n; break; }
                }
                if (realName == null) return;
                const res = results[realName];
                if (!res) return;

                const hasError = res.error != null && res.error !== false;
                const status = hasError ? 'ERROR' : res.status;
                let style = { color: '#888', label: status || '' };
                if (CIViz && typeof CIViz.statusBadgeStyle === 'function') {
                    style = CIViz.statusBadgeStyle(status);
                }
                card.style.borderLeft = '4px solid ' + style.color;

                const badge = document.createElement('span');
                badge.className = 'badge sim-status-badge';
                badge.textContent = style.label || status || '';
                badge.style.background = style.color;
                badge.style.color = '#fff';

                const title = card.querySelector('.job-title');
                if (title) {
                    title.appendChild(document.createTextNode(' '));
                    title.appendChild(badge);
                } else {
                    card.appendChild(badge);
                }
            });
        }

        function renderNeighborsSection(nodeId) {
            const wrap = document.createElement('div');
            if (!CIViz || typeof CIViz.computeNeighbors !== 'function') return wrap;
            const res = CIViz.computeNeighbors(ciData.deep_graph, nodeId) || { behind: [], ahead: [] };

            function buildSub(titleText, items) {
                const sec = document.createElement('div');
                const t = document.createElement('div');
                t.className = 'section-title';
                t.textContent = titleText;
                sec.appendChild(t);
                if (!items || !items.length) {
                    const none = document.createElement('div');
                    none.style.opacity = '0.6';
                    none.style.fontSize = '12px';
                    none.textContent = L('(tidak ada)');
                    sec.appendChild(none);
                    return sec;
                }
                const group = document.createElement('div');
                group.className = 'rel-group';
                items.forEach(item => group.appendChild(buildNeighborChip(item)));
                sec.appendChild(group);
                return sec;
            }

            wrap.appendChild(buildSub('Behind (dependencies)', res.behind));
            wrap.appendChild(buildSub('Ahead (dependents)', res.ahead));
            return wrap;
        }

        function buildNeighborChip(item) {
            const chip = document.createElement('span');
            const label = (item.label != null && String(item.label).trim() !== '') ? String(item.label) : String(item.id || '');
            const typePart = item.type ? (' · ' + item.type) : '';
            const edgePart = item.edgeType ? (' ' + item.edgeType) : '';

            // Node downstream: job di dalam pipeline child ('cjob:') dan pipeline child itu sendiri ('child:').
            if (typeof item.id === 'string' && item.id.indexOf('cjob:') === 0 && childJobById[item.id]) {
                const entry = childJobById[item.id];
                chip.className = 'rel-chip clickable';
                chip.textContent = label + typePart + edgePart;
                chip.onclick = () => openJobDrawer(entry.job, entry.meta);
                return chip;
            }
            if (typeof item.id === 'string' && item.id.indexOf('child:') === 0 && childIndexByPath[item.id.slice(6)]) {
                const cm = childIndexByPath[item.id.slice(6)];
                chip.className = 'rel-chip clickable';
                chip.textContent = label + typePart + edgePart;
                chip.onclick = () => openChildDrawer(cm);
                return chip;
            }

            const isJob = item.type === 'job' || (typeof item.id === 'string' && item.id.indexOf('job:') === 0);
            let jobObj = null;
            if (isJob) {
                let jname = null;
                if (typeof item.id === 'string' && item.id.indexOf('job:') === 0) {
                    jname = item.id.slice(4);
                }
                if (jname == null && item.label) jname = String(item.label);
                jobObj = jname != null ? (ciData.jobs || {})[jname] : null;
            }

            const canOpenFile = !!item.path;

            if (jobObj || canOpenFile) {
                chip.className = 'rel-chip clickable';
                chip.textContent = label + typePart + edgePart;
                chip.onclick = () => {
                    if (canOpenFile) {
                        openFileInEditor(item.path, item.line_number || 1);
                    }
                    if (jobObj) {
                        openJobDrawer(jobObj);
                    }
                };
            } else {
                chip.className = 'rel-chip disabled';
                chip.textContent = label + typePart + edgePart;
                chip.title = L('Tidak ada lokasi sumber untuk item ini');
            }
            return chip;
        }

        function buildIncludeChip(child) {
            const chip = document.createElement('span');
            const name = (child && (child.display_name || child.target_path)) || 'include';
            const resolved = !!(child && child.resolved && child.target_path);
            if (resolved) {
                chip.className = 'rel-chip include clickable';
                chip.textContent = '📄 ' + name;
                const line = (child && Number.isInteger(child.line_number) && child.line_number > 0) ? child.line_number : 1;
                chip.onclick = () => openFileInEditor(child.target_path, line);

        // Smart search: dukung "tag:x", "stage:y", "status:RUN", atau teks bebas.
        function parseQuery(raw) {
            const q = (raw || '').trim().toLowerCase();
            const m = q.match(/^(tag|stage|status):(.*)$/);
            if (m) return { kind: m[1], val: m[2].trim() };
            return { kind: 'text', val: q };
        }
        function jobMatchesQuery(name, job, pq) {
            const nm = (name || '').toLowerCase();
            const tags = (Array.isArray(job.tags) ? job.tags.join(',') : '').toLowerCase();
            const stage = (job.stage || 'test').toLowerCase();
            if (pq.kind === 'tag') return tags.includes(pq.val);
            if (pq.kind === 'stage') return stage.includes(pq.val);
            if (pq.kind === 'status') {
                const res = lastSimResults && lastSimResults[name];
                const stt = res ? String(res.error ? 'ERROR' : res.status).toLowerCase() : '';
                return stt.includes(pq.val);
            }
            return !pq.val || nm.includes(pq.val) || tags.includes(pq.val);
        }
        function filterJobs() {
            const pq = parseQuery(document.getElementById('searchJobs').value);
            const jobs = ciData.jobs || {};
            document.querySelectorAll('#standardContainer .job-card[data-job-name]').forEach(card => {
                const lower = card.dataset.jobName;
                let realName = null;
                for (const n of Object.keys(jobs)) { if (n.toLowerCase() === lower) { realName = n; break; } }
                const job = realName ? jobs[realName] : {};
                const match = jobMatchesQuery(realName || lower, job, pq);
                card.style.display = match ? '' : 'none';
            });
        }

        // Input pencarian: mode Standar → filter kartu; mode Detail → sorot node di graf.
        function onSearchInput() {
            if (viewMode === 'detail') {
                const q = (document.getElementById('searchJobs').value || '').toLowerCase();
                searchGraph(q);
            } else {
                filterJobs();
            }
        }

        // Sorot node graf yang labelnya cocok; kosongkan → reset.
        function searchGraph(q) {
            const nodes = document.querySelectorAll('#graphContainer .graph-node');
            if (!q) { nodes.forEach(n => n.classList.remove('search-hit','search-dim')); return; }
            nodes.forEach(n => {
                const id = (n.getAttribute('data-node-id') || '').toLowerCase();
                const txt = (n.textContent || '').toLowerCase();
                const hit = id.includes(q) || txt.includes(q);
                n.classList.toggle('search-hit', hit);
                n.classList.toggle('search-dim', !hit);
            });
        }

        // Export SVG graf ke clipboard (mode Detail).
        function exportGraphSvg() {
            const svg = document.querySelector('#graphContainer svg');
            if (!svg) { vscode.postMessage({ command: 'refresh' }); return; }
            const data = '<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML;
            copyText(data, L('SVG graf disalin ke clipboard'));
        }

        // Bangun Graphviz DOT dari deep_graph & salin ke clipboard.
        function exportGraphDot() {
            const g = ciData.deep_graph || { nodes: [], edges: [] };
            const esc = (x) => '"' + String(x).replace(/"/g, '\\"') + '"';
            let out = 'digraph pipeline {\n  rankdir=LR;\n  node [shape=box, style=rounded];\n';
            (g.nodes || []).forEach(n => {
                out += '  ' + esc(n.id) + ' [label=' + esc(n.label || n.id) + '];\n';
            });
            (g.edges || []).forEach(e => {
                out += '  ' + esc(e.source) + ' -> ' + esc(e.target) + ' [label=' + esc(e.type || '') + '];\n';
            });
            out += '}\n';
            copyText(out, L('Graphviz DOT disalin ke clipboard'));
        }

        // Task #4: persist/restore state webview (mode, filter, layout, skenario, posisi node).
        function persistState() {
            try {
                if (typeof vscode.setState !== 'function') return;
                const st = {
                    viewMode: viewMode,
                    layoutDir: (graphView && graphView.getLayoutDirection) ? graphView.getLayoutDirection() : 'LR',
                    enabledTypes: currentEnabledTypes ? Array.from(currentEnabledTypes) : null,
                    nodePositions: (graphView && graphView.getNodePositions) ? graphView.getNodePositions() : null,
                    scenario: (sim && sim.getScenario) ? sim.getScenario() : null,
                    search: (document.getElementById('searchJobs') || {}).value || '',
                    minimap: (graphView && graphView.isMinimapEnabled) ? graphView.isMinimapEnabled() : false
                };
                vscode.setState(st);
            } catch (e) {}
        }
        function loadPersistedState() {
            try { return (typeof vscode.getState === 'function') ? (vscode.getState() || null) : null; } catch (e) { return null; }
        }

        function copyText(text, okMsg) {
            try {
                if (typeof navigator !== 'undefined' && navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => { try { alert(okMsg); } catch(e){} });
                    return;
                }
            } catch (e) {}
            try { alert(L('Clipboard tidak tersedia')); } catch(e){}
        }

        // =====================================================================
        // Downstream pipelines: parent-child / multi-project / dynamic child
        // =====================================================================

        let childIndexByPath = {};   // path -> meta pipeline downstream
        let childJobById = {};       // 'cjob:<path>/<job>' -> { meta, job }
        let childSimByPath = {};     // path -> hasil simulasi pipeline downstream

        function childTree() { return (ciData && ciData.child_pipelines) || {}; }

        /** Telusuri pohon downstream; `sims` (opsional) diikuti paralel dengan `metas`. */
        function walkChildren(metas, sims, cb) {
            Object.keys(metas || {}).forEach(function (b) {
                const m = metas[b];
                const s = sims ? sims[b] : null;
                cb(m, s || null);
                walkChildren(m.children, s ? s.child_pipelines : null, cb);
            });
        }

        function countChildPipelines(metas) {
            let n = 0;
            walkChildren(metas, null, function () { n += 1; });
            return n;
        }

        function buildChildIndex() {
            childIndexByPath = {};
            childJobById = {};
            walkChildren(childTree(), null, function (m) {
                childIndexByPath[m.path] = m;
                Object.keys(m.jobs || {}).forEach(function (jn) {
                    childJobById['cjob:' + m.path + '/' + jn] = { meta: m, job: m.jobs[jn] };
                });
            });
        }

        function indexChildSims(simTree) {
            childSimByPath = {};
            walkChildren(childTree(), simTree || null, function (m, s) { if (s) childSimByPath[m.path] = s; });
        }

        /** Hasil simulasi job child dipipihkan ke kunci id node graf ('cjob:<path>/<job>'). */
        function flattenChildResults() {
            const flat = {};
            Object.keys(childSimByPath).forEach(function (path) {
                const s = childSimByPath[path];
                Object.keys((s && s.results) || {}).forEach(function (jn) { flat['cjob:' + path + '/' + jn] = s.results[jn]; });
            });
            return flat;
        }

        function applyChildBadgesToGraph() {
            if (!graphView || typeof graphView.setSimulationResults !== 'function') return;
            const flat = flattenChildResults();
            if (!Object.keys(flat).length) return;
            const base = (sim && typeof sim.getLastResults === 'function') ? sim.getLastResults() : null;
            if (!base) return;
            graphView.setSimulationResults(Object.assign({}, base, flat));
        }

        const CHILD_STATUS_LABEL = {
            RESOLVED: ['resolved', '#2e7d32'],
            SAMPLE: ['pakai file contoh', '#b28704'],
            PLACEHOLDER: ['dynamic · belum ada contoh', '#b28704'],
            PARTIAL: ['sebagian ter-resolve', '#ef6c00'],
            UNRESOLVED: ['tidak ter-resolve', '#c62828'],
            CYCLE: ['siklus', '#c62828'],
            DEPTH_EXCEEDED: ['terlalu dalam', '#c62828']
        };

        function childStatusLabel(status, lower) {
            const hit = CHILD_STATUS_LABEL[status];
            if (hit) return [L(hit[0]), hit[1]];
            const raw = String(status || '?');
            return [lower ? raw.toLowerCase() : raw, '#607d8b'];
        }

        function childKindLabel(meta) {
            if (meta.kind === 'project') return 'multi-project';
            return meta.dynamic ? 'dynamic child' : 'child';
        }

        function mkEl(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }

        function mkChip(text, color, title) {
            const c = mkEl('span', 'child-chip', text);
            if (color) c.style.background = color;
            if (title) c.title = title;
            return c;
        }

        function simStatusBadge(res) {
            if (!res) return null;
            const hasError = res.error != null && res.error !== false;
            const status = hasError ? 'ERROR' : res.status;
            let style = { color: '#888', label: status || '' };
            if (CIViz && typeof CIViz.statusBadgeStyle === 'function') style = CIViz.statusBadgeStyle(status);
            const b = mkEl('span', 'badge sim-status-badge', style.label || status || '');
            b.style.background = style.color;
            b.style.color = '#fff';
            return { badge: b, color: style.color };
        }

        function describeTriggered(sim) {
            if (!sim) return null;
            if (sim.triggered === true) return [L('terpicu'), '#2e7d32'];
            if (sim.triggered === 'conditional') return [L('terpicu setelah manual/delayed'), '#1565c0'];
            return [L('tidak terpicu'), '#757575'];
        }

        function buildChildJobCard(meta, job) {
            const card = mkEl('div', 'job-card');
            const title = mkEl('div', 'job-title', job.job_name || '');
            card.appendChild(title);
            const sim = childSimByPath[meta.path];
            const sb = simStatusBadge(sim && sim.results ? sim.results[job.job_name] : null);
            if (sb) {
                title.appendChild(document.createTextNode(' '));
                title.appendChild(sb.badge);
                card.style.borderLeft = '4px solid ' + sb.color;
            }
            const row = mkEl('div', 'job-meta');
            const nested = (meta.children || {})[job.job_name];
            if (nested) row.appendChild(mkEl('span', 'badge manual', '⤷ ' + childKindLabel(nested)));
            if (job.when === 'manual') row.appendChild(mkEl('span', 'badge manual', 'manual'));
            if (job.parallel_info && job.parallel_info.count) row.appendChild(mkEl('span', 'badge tag', '×' + job.parallel_info.count));
            (Array.isArray(job.tags) ? job.tags : []).forEach(function (t) { row.appendChild(mkEl('span', 'badge tag', '🏷 ' + t)); });
            if (row.childNodes.length) card.appendChild(row);
            if (job.source_file) card.appendChild(mkEl('div', 'job-source', basename(job.source_file)));
            card.onclick = function (ev) { ev.stopPropagation(); openJobDrawer(job, meta); };
            return card;
        }

        function buildChildStageColumns(meta) {
            const wrap = mkEl('div', 'pipeline-graph child-stages');
            const jobs = meta.jobs || {};
            const stages = (meta.stages || []).slice();
            const known = new Set(stages);
            const by = {};
            stages.forEach(function (s) { by[s] = []; });
            let other = false;
            Object.keys(jobs).forEach(function (n) {
                const j = jobs[n];
                let st = j.stage || 'test';
                if (!known.has(st)) { st = 'other'; other = true; }
                (by[st] = by[st] || []).push(j);
            });
            const cols = stages.slice();
            if (other) cols.push('other');
            cols.forEach(function (stage) {
                const list = by[stage] || [];
                if (!list.length) return;
                const col = mkEl('div', 'stage-column');
                const header = mkEl('div', 'stage-header');
                header.appendChild(mkEl('span', null, stage));
                header.appendChild(mkEl('span', 'stage-badge', String(list.length)));
                col.appendChild(header);
                const jl = mkEl('div', 'job-list');
                list.forEach(function (j) { jl.appendChild(buildChildJobCard(meta, j)); });
                col.appendChild(jl);
                wrap.appendChild(col);
            });
            return wrap;
        }

        function buildChildPanel(meta, depth) {
            const sim = childSimByPath[meta.path] || null;
            const panel = mkEl('div', 'child-panel');
            panel.setAttribute('data-child-path', meta.path);

            const head = mkEl('div', 'child-panel-header');
            head.appendChild(mkEl('span', 'child-panel-title', '↳ ' + meta.bridge_job));
            head.appendChild(mkChip(childKindLabel(meta), '#ad1457'));
            const st = childStatusLabel(meta.status, true);
            head.appendChild(mkChip(st[0], st[1], meta.status_detail || ''));
            if (meta.strategy) {
                head.appendChild(mkChip('strategy: ' + meta.strategy, '#37474f',
                    meta.strategy === 'depend' ? L('depend tidak lagi direkomendasikan; gunakan mirror') : L('bridge job meniru status pipeline downstream')));
            }
            if (meta.project) head.appendChild(mkChip(meta.project + (meta.branch ? '@' + meta.branch : ''), '#37474f'));
            const trig = describeTriggered(sim);
            if (trig) head.appendChild(mkChip(trig[0], trig[1], (sim && sim.reason) || ''));
            if (sim && sim.summary) {
                Object.keys(sim.summary).forEach(function (k) {
                    const style = (CIViz && CIViz.statusBadgeStyle) ? CIViz.statusBadgeStyle(k) : { color: '#888' };
                    head.appendChild(mkChip(k + ' ' + sim.summary[k], style.color));
                });
            }
            head.onclick = function () { openChildDrawer(meta); };
            panel.appendChild(head);

            if (Object.keys(meta.jobs || {}).length) {
                panel.appendChild(buildChildStageColumns(meta));
            } else {
                const note = mkEl('div', 'child-note', meta.status_detail || L('Tidak ada job yang bisa ditampilkan.'));
                panel.appendChild(note);
            }
            // Child dinamis: selalu sediakan aksi pilih/ganti/hapus file contoh (placeholder maupun sudah ada contoh).
            if (meta.dynamic) panel.appendChild(buildDynamicActions(meta));
            Object.keys(meta.children || {}).forEach(function (b) {
                panel.appendChild(buildChildPanel(meta.children[b], (depth || 0) + 1));
            });
            return panel;
        }

        function renderDownstream() {
            const host = document.getElementById('downstreamContainer');
            if (!host) return;
            host.innerHTML = '';
            const children = childTree();
            const names = Object.keys(children);
            if (!names.length || viewMode !== 'standard') {
                host.style.display = 'none';
                return;
            }
            host.style.display = '';
            host.appendChild(mkEl('div', 'downstream-title', 'Downstream pipelines (' + countChildPipelines(children) + ')'));
            names.forEach(function (b) { host.appendChild(buildChildPanel(children[b], 0)); });
        }

        function buildDynamicActions(meta) {
            const actions = mkEl('div', 'child-actions');
            const d = meta.dynamic || {};
            const pick = mkEl('button', 'child-btn', L('📂 Pilih file contoh…'));
            pick.onclick = function (ev) { ev.stopPropagation(); vscode.postMessage({ command: 'pickDynamicSample', job: meta.bridge_job }); };
            actions.appendChild(pick);
            if (d.sample_file) {
                const open = mkEl('button', 'child-btn', L('↗ Buka file contoh'));
                open.onclick = function (ev) { ev.stopPropagation(); openFileInEditor(d.sample_file, 1); };
                actions.appendChild(open);
            }
            if (d.sample_source === 'cli') {
                const clear = mkEl('button', 'child-btn', L('✖ Hapus pilihan'));
                clear.onclick = function (ev) { ev.stopPropagation(); vscode.postMessage({ command: 'clearDynamicSample', job: meta.bridge_job }); };
                actions.appendChild(clear);
            }
            return actions;
        }

        function addKv(table, k, v) {
            table.appendChild(mkEl('div', 'k', k));
            const cell = mkEl('div', 'v');
            if (v instanceof Node) cell.appendChild(v); else cell.textContent = (v === undefined || v === null || v === '') ? '-' : String(v);
            table.appendChild(cell);
        }

        function fileLink(path, line) {
            const a = mkEl('span', 'rel-chip clickable', basename(path));
            a.title = path;
            a.onclick = function (ev) { ev.stopPropagation(); openFileInEditor(path, line || 1); };
            return a;
        }

        function varsBox(vars) {
            const box = mkEl('div', 'code-box');
            const keys = Object.keys(vars || {});
            if (!keys.length) { box.textContent = L('(tidak ada)'); return box; }
            keys.forEach(function (k) {
                const row = mkEl('div');
                const key = mkEl('strong', null, k + ': ');
                key.style.color = '#4fc3f7';
                row.appendChild(key);
                row.appendChild(document.createTextNode(String(vars[k])));
                box.appendChild(row);
            });
            return box;
        }

        /** Rincian lengkap satu pipeline downstream (dipakai drawer job bridge & drawer node child). */
        function buildChildDetail(meta) {
            const root = mkEl('div');
            root.style.display = 'flex';
            root.style.flexDirection = 'column';
            root.style.gap = '12px';
            const sim = childSimByPath[meta.path] || null;

            const table = mkEl('div', 'kv-table');
            const st = childStatusLabel(meta.status, false);
            addKv(table, L('Jenis'), childKindLabel(meta));
            addKv(table, 'Status', mkChip(st[0], st[1]));
            if (meta.status_detail) addKv(table, L('Detail'), meta.status_detail);
            if (meta.project) addKv(table, 'Project', meta.project + (meta.branch ? ' @ ' + meta.branch : ' (default branch)'));
            addKv(table, 'Strategy', meta.strategy || L('(default: bridge sukses saat pipeline terbuat)'));
            const fwd = meta.forward || {};
            addKv(table, 'Forward', 'yaml_variables=' + (fwd.yaml_variables !== false) + ', pipeline_variables=' + (fwd.pipeline_variables === true));
            if (meta.entry_file) addKv(table, L('Konfigurasi'), fileLink(meta.entry_file, 1));
            root.appendChild(table);

            if ((meta.includes || []).length) {
                root.appendChild(mkEl('div', 'section-title', L('Sumber konfigurasi child')));
                const group = mkEl('div', 'rel-group');
                meta.includes.forEach(function (inc) {
                    const label = inc.kind + ': ' + inc.display_name;
                    const chip = mkEl('span', 'rel-chip ' + (inc.resolved ? 'clickable' : 'disabled'), label);
                    if (inc.resolved && inc.target_path) {
                        chip.onclick = function (ev) { ev.stopPropagation(); openFileInEditor(inc.target_path, 1); };
                    } else {
                        chip.title = L('Tidak bisa diresolve offline');
                    }
                    group.appendChild(chip);
                });
                root.appendChild(group);
            }

            if (meta.dynamic) {
                const d = meta.dynamic;
                root.appendChild(mkEl('div', 'section-title', L('Child dinamis (dibuat saat runtime)')));
                const dt = mkEl('div', 'kv-table');
                addKv(dt, 'Artifact', d.artifact);
                addKv(dt, 'Job generator', d.job);
                addKv(dt, L('File contoh'), d.sample_file ? fileLink(d.sample_file, 1) : L('(belum ada)'));
                if (d.sample_source) addKv(dt, L('Sumber contoh'), d.sample_source);
                root.appendChild(dt);
                if (d.hint) root.appendChild(mkEl('div', 'child-note', d.hint));
                root.appendChild(buildDynamicActions(meta));
            }

            if (sim) {
                root.appendChild(mkEl('div', 'section-title', L('Simulasi')));
                const stt = mkEl('div', 'kv-table');
                const trig = describeTriggered(sim);
                addKv(stt, 'Bridge job', sim.bridge_status);
                if (trig) addKv(stt, 'Pipeline', mkChip(trig[0], trig[1]));
                addKv(stt, L('Alasan'), sim.reason);
                if (sim.pipeline_created === false) addKv(stt, 'workflow:rules', L('pipeline tidak dibuat'));
                root.appendChild(stt);
                root.appendChild(mkEl('div', 'section-title', L('Variabel yang diteruskan bridge')));
                root.appendChild(varsBox(sim.forwarded_variables));
                if (sim.scenario_variables) {
                    root.appendChild(mkEl('div', 'section-title', L('Variabel efektif di pipeline downstream')));
                    root.appendChild(varsBox(sim.scenario_variables));
                }
            }

            const jobNames = Object.keys(meta.jobs || {});
            if (jobNames.length) {
                root.appendChild(mkEl('div', 'section-title', 'Job (' + jobNames.length + ')'));
                const group = mkEl('div', 'rel-group');
                jobNames.forEach(function (jn) {
                    const j = meta.jobs[jn];
                    const chip = mkEl('span', 'rel-chip clickable', jn + ' · ' + (j.stage || 'test'));
                    const sb = simStatusBadge(sim && sim.results ? sim.results[jn] : null);
                    if (sb) { chip.appendChild(document.createTextNode(' ')); chip.appendChild(sb.badge); }
                    chip.onclick = function (ev) { ev.stopPropagation(); openJobDrawer(j, meta); };
                    group.appendChild(chip);
                });
                root.appendChild(group);
            }

            const diags = meta.diagnostics || [];
            if (diags.length) {
                root.appendChild(mkEl('div', 'section-title', L('Temuan validasi child ({0})', diags.length)));
                diags.forEach(function (d) {
                    root.appendChild(mkEl('div', 'diag-item ' + (d.severity || 'info'), '[' + d.code + '] ' + d.message));
                });
            }
            return root;
        }

        function openChildDrawer(meta) {
            document.getElementById('drawerJobTitle').textContent = 'Downstream · ' + meta.path;
            const body = document.getElementById('drawerJobBody');
            body.innerHTML = '';
            if (meta.source_file) {
                const btn = mkEl('button', 'open-file-btn', L('📂 Buka bridge job (trigger) di editor'));
                btn.onclick = function () { openFileInEditor(meta.source_file, meta.line_number); };
                body.appendChild(btn);
            }
            body.appendChild(buildChildDetail(meta));
            document.getElementById('drawerOverlay').classList.add('open');
            document.getElementById('jobDrawer').classList.add('open');
        }

        function renderChildSection(job, scope) {
            const host = document.getElementById('drawerChildSection');
            if (!host) return;
            host.innerHTML = '';
            const pool = scope ? (scope.children || {}) : childTree();
            const meta = pool[job.job_name];
            if (!meta) { host.style.display = 'none'; return; }
            host.style.display = '';
            host.appendChild(mkEl('div', 'section-title', 'Downstream pipeline'));
            host.appendChild(buildChildDetail(meta));
        }

        // =====================================================================
        // Task 12.3 — Job drawer with clickable extends/needs (multi-target)
        // =====================================================================

        function openJobDrawer(job, scope) {
            document.getElementById('drawerJobTitle').textContent = job.job_name || 'Job Details';
            const body = document.getElementById('drawerJobBody');

            let varsHtml = '';
            if (job.variables && Object.keys(job.variables).length) {
                varsHtml = '<div class="code-box">';
                Object.entries(job.variables).forEach(([k, v]) => {
                    varsHtml += '<div><strong style="color: #4fc3f7;">' + escapeHtml(k) + ':</strong> ' + escapeHtml(typeof v === 'object' ? JSON.stringify(v) : v) + '</div>';
                });
                varsHtml += '</div>';
            } else {
                varsHtml = '<div style="opacity: 0.6; font-size: 12px;">(No specific variables)</div>';
            }

            let rulesHtml = '';
            if (job.rules && job.rules.length) {
                rulesHtml = '<div class="code-box">' + escapeHtml(JSON.stringify(job.rules, null, 2)) + '</div>';
            } else {
                rulesHtml = '<div style="opacity: 0.6; font-size: 12px;">(Default: runs on standard events)</div>';
            }

            let scriptHtml = '';
            const allScripts = [
                ...(job.before_script ? ['# --- before_script ---', ...(Array.isArray(job.before_script) ? job.before_script : [job.before_script])] : []),
                ...(job.script ? ['# --- script ---', ...(Array.isArray(job.script) ? job.script : [job.script])] : []),
                ...(job.after_script ? ['# --- after_script ---', ...(Array.isArray(job.after_script) ? job.after_script : [job.after_script])] : [])
            ];
            if (allScripts.length) {
                scriptHtml = '<div class="code-box">' + escapeHtml(allScripts.join('\n')) + '</div>';
            } else {
                scriptHtml = '<div style="opacity: 0.6; font-size: 12px;">(No script defined directly)</div>';
            }

            const tagsInfo = job.tags && job.tags.length ? escapeHtml(job.tags.join(', ')) : '(no tags)';

            body.innerHTML = 
                '<button class="open-file-btn" id="openSourceFileBtn">' +
                    '📂 Open Source File in VS Code' +
                '</button>' +
                '<div>' +
                    '<div class="section-title">Stage & Runner Tags</div>' +
                    '<div>Stage: <strong>' + escapeHtml(job.stage || 'test') + '</strong></div>' +
                    '<div>Tags: ' + tagsInfo + '</div>' +
                '</div>' +
                '<button class="open-file-btn" id="copyResolvedBtn" style="margin-top:4px;">' +
                    '\u2398 Copy Resolved Job (YAML-ish)' +
                '</button>' +
                '<div id="drawerTraceSection"></div>' +
                '<div id="drawerExtendsSection"></div>' +
                '<div id="drawerNeedsSection"></div>' +
                '<div id="drawerChildSection"></div>' +
                '<div id="drawerNeighborsSection"></div>' +
                '<div>' +
                    '<div class="section-title">Variables</div>' +
                    varsHtml +
                '</div>' +
                '<div>' +
                    '<div class="section-title">Rules / Triggers</div>' +
                    rulesHtml +
                '</div>' +
                '<div>' +
                    '<div class="section-title">Execution Script</div>' +
                    scriptHtml +
                '</div>' +
                '<div>' +
                    '<div class="section-title">Full Definition (YAML)</div>' +
                    '<div class="code-box">' + escapeHtml(JSON.stringify(job.definition, null, 2)) + '</div>' +
                '</div>';

            const btn = document.getElementById('openSourceFileBtn');
            if (btn && job.source_file) {
                btn.onclick = () => openFileInEditor(job.source_file, job.line_number);
            } else if (btn) {
                btn.disabled = true;
            }

            renderExtendsSection(job);
            renderNeedsSection(job, scope);
            renderChildSection(job, scope);
            renderRulesTraceSection(job, scope);
            wireCopyResolvedButton(job);

            const nHost = document.getElementById('drawerNeighborsSection');
            if (nHost) {
                nHost.innerHTML = '';
                nHost.appendChild(renderNeighborsSection(
                    scope ? ('cjob:' + scope.path + '/' + (job.job_name || '')) : ('job:' + (job.job_name || ''))));
            }

            document.getElementById('drawerOverlay').classList.add('open');
            document.getElementById('jobDrawer').classList.add('open');
        }

        // =====================================================================
        // v2.0.0 #2 — Rules Trace UI (step-by-step evaluasi rules dari simulator)
        // =====================================================================
        function renderRulesTraceSection(job, scope) {
            const host = document.getElementById('drawerTraceSection');
            if (!host) return;
            host.innerHTML = '';
            const name = job && job.job_name;
            const pool = scope ? ((childSimByPath[scope.path] || {}).results || null) : lastSimResults;
            const res = (name && pool && pool[name]) ? pool[name] : null;
            const trace = res && Array.isArray(res.trace) ? res.trace : null;
            if (!res) {
                host.innerHTML = '<div class="section-title">Rules Trace</div>' +
                    '<div style="opacity:0.6;font-size:12px;">' + escapeHtml(L('Jalankan simulasi (Panel Skenario) untuk melihat evaluasi rules langkah demi langkah.')) + '</div>';
                return;
            }
            const statusTxt = res.error ? ('ERROR: ' + res.error) : (String(res.status || '') + (res.when_effective ? ' (when: ' + res.when_effective + ')' : ''));
            let html = '<div class="section-title">Rules Trace</div>';
            html += '<div style="font-size:12px;margin-bottom:6px;">' + escapeHtml(L('Hasil: ')) + '<strong>' + escapeHtml(statusTxt) + '</strong></div>';
            if (res.reason) {
                html += '<div style="font-size:11px;opacity:0.8;margin-bottom:6px;">' + escapeHtml(String(res.reason)) + '</div>';
            }
            if (!trace || !trace.length) {
                html += '<div style="opacity:0.6;font-size:12px;">' + escapeHtml(L('(Tidak ada rules eksplisit untuk job ini)')) + '</div>';
                host.innerHTML = html;
                return;
            }
            html += '<div class="trace-list">';
            trace.forEach(function (t) {
                const eff = t.effective ? ' trace-effective' : '';
                const reached = t.reached === false ? ' trace-unreached' : '';
                const mark = t.effective ? '\u2705' : (t.matched ? '\u2611' : '\u2717');
                html += '<div class="trace-item' + eff + reached + '">';
                html += '<div class="trace-head">' + mark + ' rule[' + t.index + ']' +
                    (t.when ? ' <span class="trace-when">when: ' + escapeHtml(String(t.when)) + '</span>' : '') +
                    (t.effective ? ' <span class="trace-badge">EFFECTIVE</span>' : '') +
                    (t.reached === false ? ' <span class="trace-badge trace-skip">not reached</span>' : '') +
                    '</div>';
                const clauses = Array.isArray(t.clauses) ? t.clauses : [];
                clauses.forEach(function (c) {
                    if (c.clause === 'none') {
                        html += '<div class="trace-clause">\u2192 no condition (always match)</div>';
                        return;
                    }
                    const ok = c.result ? '\u2713' : '\u2717';
                    let expr = c.expr;
                    if (Array.isArray(expr)) expr = expr.join(', ');
                    else if (expr === null || expr === undefined) expr = '';
                    html += '<div class="trace-clause">' + ok + ' <em>' + escapeHtml(c.clause) + '</em>: <code>' +
                        escapeHtml(String(expr)) + '</code>' +
                        (c.error ? ' <span class="trace-err">(' + escapeHtml(String(c.error)) + ')</span>' : '') +
                        '</div>';
                });
                html += '</div>';
            });
            html += '</div>';
            host.innerHTML = html;
        }

        // =====================================================================
        // v2.0.0 #7b — Copy Resolved Job: merge extends + variables -> YAML-ish
        // =====================================================================
        function resolveJobYaml(job) {
            // Utamakan definisi efektif dari engine (extends + !reference + default sudah digabung).
            if (job && job.resolved_definition && typeof job.resolved_definition === 'object') {
                const resolved = JSON.parse(JSON.stringify(job.resolved_definition));
                delete resolved.extends;
                return toYamlish(job.job_name || 'job', resolved);
            }
            // Fallback (data lama): gabungkan definisi efektif: base dari extends (dangkal) lalu override job.
            const out = {};
            function shallowMerge(target, srcObj) {
                if (!srcObj || typeof srcObj !== 'object') return;
                Object.keys(srcObj).forEach(function (k) {
                    const v = srcObj[k];
                    if (v && typeof v === 'object' && !Array.isArray(v) &&
                        target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
                        shallowMerge(target[k], v);
                    } else {
                        target[k] = v;
                    }
                });
            }
            // Terapkan definisi tiap parent extends (bila tersedia definisinya).
            const extInfo = Array.isArray(job.extends_info) ? job.extends_info : [];
            extInfo.forEach(function (ext) {
                if (ext && ext.definition && typeof ext.definition === 'object') {
                    shallowMerge(out, ext.definition);
                }
            });
            // Definisi job sendiri menang.
            if (job.definition && typeof job.definition === 'object') {
                shallowMerge(out, job.definition);
            }
            // Pastikan variables efektif tergabung.
            if (job.variables && Object.keys(job.variables).length) {
                out.variables = Object.assign({}, out.variables || {}, job.variables);
            }
            // 'extends' key tidak relevan lagi pada bentuk resolved.
            delete out.extends;
            return toYamlish(job.job_name || 'job', out);
        }

        function toYamlish(rootName, obj) {
            const lines = [];
            function emit(val, indent) {
                const pad = '  '.repeat(indent);
                if (Array.isArray(val)) {
                    val.forEach(function (item) {
                        if (item && typeof item === 'object') {
                            lines.push(pad + '-');
                            emit(item, indent + 1);
                        } else {
                            lines.push(pad + '- ' + scalar(item));
                        }
                    });
                } else if (val && typeof val === 'object') {
                    Object.keys(val).forEach(function (k) {
                        const v = val[k];
                        if (v && typeof v === 'object' && Object.keys(v).length) {
                            lines.push(pad + k + ':');
                            emit(v, indent + 1);
                        } else if (v && typeof v === 'object') {
                            lines.push(pad + k + ': ' + (Array.isArray(v) ? '[]' : '{}'));
                        } else {
                            lines.push(pad + k + ': ' + scalar(v));
                        }
                    });
                } else {
                    lines.push(pad + scalar(val));
                }
            }
            function scalar(v) {
                if (v === null || v === undefined) return 'null';
                if (typeof v === 'string') {
                    if (v === '' || /[:#\-\{\}\[\]&*!|>'"%@`]/.test(v) || /^\s|\s$/.test(v)) {
                        return JSON.stringify(v);
                    }
                    return v;
                }
                return String(v);
            }
            lines.push(rootName + ':');
            emit(obj, 1);
            return lines.join('\n');
        }

        function wireCopyResolvedButton(job) {
            const btn = document.getElementById('copyResolvedBtn');
            if (!btn) return;
            btn.onclick = function () {
                let text = '';
                try { text = resolveJobYaml(job); }
                catch (e) { text = L('# gagal resolve: {0}', e.message); }
                const done = function () {
                    const old = btn.textContent;
                    btn.textContent = '\u2714 Copied!';
                    setTimeout(function () { btn.textContent = old; }, 1500);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, function () {
                        vscode.postMessage({ command: 'copyText', text: text }); done();
                    });
                } else {
                    vscode.postMessage({ command: 'copyText', text: text }); done();
                }
            };
        }

        function renderExtendsSection(job) {
            const host = document.getElementById('drawerExtendsSection');
            if (!host) return;
            const extendsInfo = Array.isArray(job.extends_info) ? job.extends_info : [];
            if (!extendsInfo.length) {
                if (!job.extends) { host.style.display = 'none'; return; }
            }
            host.innerHTML = '<div class="section-title">Extends</div>';
            const group = document.createElement('div');
            group.className = 'rel-group';

            if (extendsInfo.length) {
                extendsInfo.forEach(ext => {
                    group.appendChild(buildRelationChip('extends', ext.name, ext.source_file, ext.line_number));
                });
            } else {
                // Fallback: hanya nama extends tanpa source (nonaktif).
                const list = Array.isArray(job.extends) ? job.extends : [job.extends];
                list.forEach(name => {
                    group.appendChild(buildRelationChip('extends', name, null, null));
                });
            }
            host.appendChild(group);
        }

        function renderNeedsSection(job, scope) {
            const pool = scope ? (scope.jobs || {}) : (ciData.jobs || {});
            const host = document.getElementById('drawerNeedsSection');
            if (!host) return;
            const needs = Array.isArray(job.needs) ? job.needs : [];
            if (!needs.length) { host.style.display = 'none'; return; }

            host.innerHTML = '<div class="section-title">Needs</div>';
            const group = document.createElement('div');
            group.className = 'rel-group';

            needs.forEach(need => {
                const targetName = (need && typeof need === 'object') ? need.job : need;
                const targetJob = pool[targetName];
                if (targetJob) {
                    group.appendChild(buildRelationChip('needs', targetName, targetJob.source_file, targetJob.line_number));
                } else {
                    // Target tidak ditemukan → chip nonaktif (Req 4.6 / 7.5).
                    group.appendChild(buildRelationChip('needs', targetName, null, null));
                }
            });
            host.appendChild(group);
        }

        /**
         * Bangun satu chip relasi (extends/needs) yang dapat diklik ke Source_Location target.
         * Req 4.4/4.5 (multi-target = beberapa chip); Req 4.6 (tanpa Source_Location → nonaktif);
         * Req 4.7 (ada path tanpa line valid → line 1, ditangani buildOpenFileMsg/openFileInEditor).
         */
        function buildRelationChip(kind, name, sourceFile, lineNumber) {
            const chip = document.createElement('span');
            const label = (name === null || name === undefined) ? '(unknown)' : String(name);
            if (sourceFile) {
                chip.className = 'rel-chip ' + kind + ' clickable';
                chip.textContent = label;
                chip.onclick = () => openFileInEditor(sourceFile, lineNumber);
            } else {
                chip.className = 'rel-chip ' + kind + ' disabled';
                chip.textContent = label;
                chip.title = L('Tidak ada lokasi sumber untuk target ini');
            }
            return chip;
        }

        // =====================================================================
        // Task 12.5 — Error node drawer (status + open-file gating)
        // =====================================================================

        function openErrorNodeDrawer(node) {
            document.getElementById('drawerJobTitle').textContent = node.label || node.id || 'Error File';
            const body = document.getElementById('drawerJobBody');

            // Req 7.2/7.3 — tampilkan status; kosong → "status tidak tersedia".
            const hasStatus = node.status !== undefined && node.status !== null && String(node.status).trim() !== '';
            const statusHtml = hasStatus
                ? '<div class="status-value" style="color:#ef9a9a;">' + escapeHtml(node.status) + '</div>'
                : '<div class="status-unavailable">' + escapeHtml(L('status tidak tersedia')) + '</div>';

            // Req 7.4 — tanpa path → nonaktifkan aksi buka file + indikasi.
            const hasPath = !!node.path;
            const btnHtml = hasPath
                ? '<button class="open-file-btn" id="openSourceFileBtn">📂 Open Source File in VS Code</button>'
                : '<button class="open-file-btn" id="openSourceFileBtn" disabled>📂 Open Source File (unavailable)</button>' +
                  '<div class="open-file-note">' + escapeHtml(L('Aksi buka file tidak tersedia: node ini tidak memiliki path ke file yang ada.')) + '</div>';

            body.innerHTML =
                btnHtml +
                '<div>' +
                    '<div class="section-title">Type</div>' +
                    '<div>' + escapeHtml(node.type) + '</div>' +
                '</div>' +
                '<div>' +
                    '<div class="section-title">Status</div>' +
                    statusHtml +
                '</div>' +
                (node.path ? ('<div><div class="section-title">Path</div><div class="file-path">' + escapeHtml(node.path) + '</div></div>') : '') +
                '<div id="drawerNeighborsSection"></div>';

            const btn = document.getElementById('openSourceFileBtn');
            if (btn && hasPath) {
                btn.onclick = () => openFileInEditor(node.path, node.line_number);
            }

            const nHost = document.getElementById('drawerNeighborsSection');
            if (nHost) {
                nHost.innerHTML = '';
                nHost.appendChild(renderNeighborsSection(node.id));
            }

            document.getElementById('drawerOverlay').classList.add('open');
            document.getElementById('jobDrawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('jobDrawer').classList.remove('open');
        }

        // =====================================================================
        // Task 17 — Pipeline Rules Simulator: Panel Skenario + message wiring
        // =====================================================================

        function setupSimPanel() {
            const simPanelEl = document.getElementById('simPanel');
            if (!simPanelEl) return;
            if (!CIViz || typeof CIViz.createSimUI !== 'function') {
                simPanelEl.innerHTML = '';
                return; // bundle simUI tak tersedia — panel dilewati tanpa mengganggu graf.
            }
            sim = CIViz.createSimUI(simPanelEl, {
                doc: document, vscode: vscode, graphView: graphView,
                // Mode Simulasi dimatikan / simulasi gagal: bersihkan label status di semua tampilan.
                onClear: function () {
                    lastSimResults = null;
                    if (viewMode === 'standard') applyStandardSimBadges(null);
                    indexChildSims(null);
                    renderDownstream();
                }
            });
            sim.render(ciData);
        }

        // Terima hasil simulasi dari host (Req 12/13/14/8.6).
        window.addEventListener('message', (e) => {
            if (e && e.data && e.data.command === 'simulationResult') {
                if (sim && typeof sim.onSimulationResult === 'function') {
                    sim.onSimulationResult(e.data);
                }
                lastSimResults = (e.data && e.data.results) ? e.data.results : null;
                if (viewMode === 'standard') {
                    applyStandardSimBadges(lastSimResults);
                }
                // Pipeline downstream (child / multi-project / dynamic): simpan hasil & perbarui tampilan.
                indexChildSims(e.data && !e.data.error ? e.data.child_pipelines : null);
                renderDownstream();
                applyChildBadgesToGraph();
            } else if (e && e.data && e.data.command === 'simulationMatrixResult') {
                // v2.0.0 #3 — hasil matrix diteruskan ke simUI.
                if (sim && typeof sim.onMatrixResult === 'function') {
                    sim.onMatrixResult(e.data);
                }
            } else if (e && e.data && e.data.command === 'focusJob') {
                handleFocusJob(e.data.job);
            }
        });

        // Fokus ke job tertentu (dipanggil dari CodeLens via extension.js).
        function handleFocusJob(jobName) {
            if (!jobName) return;
            const job = (ciData.jobs || {})[jobName];
            if (viewMode === 'detail') {
                if (graphView && typeof graphView.focusNode === 'function') {
                    graphView.focusNode('job:' + jobName);
                }
                if (job) openJobDrawer(job);
            } else {
                if (job) openJobDrawer(job);
            }
        }

        // Wire tombol mode switch.
        const _modeStdBtn = document.getElementById('modeStandardBtn');
        const _modeDetBtn = document.getElementById('modeDetailBtn');
        if (_modeStdBtn) _modeStdBtn.onclick = () => setViewMode('standard');
        if (_modeDetBtn) _modeDetBtn.onclick = () => setViewMode('detail');

        buildChildIndex();
        renderHeader();
        // Panel Skenario harus tersedia di kedua mode (tidak bergantung graf).
        setupSimPanel();

        // Task #4: restore state tersimpan (mode, layout, filter, skenario, search).
        const _persisted = loadPersistedState();
        const _initialMode = (_persisted && _persisted.viewMode === 'detail') ? 'detail' : 'standard';
        if (_persisted && _persisted.search) {
            const sb = document.getElementById('searchJobs');
            if (sb) sb.value = _persisted.search;
        }
        setViewMode(_initialMode);
        // Sinkronkan label tombol layout bila state tersimpan TB (restore aktual dilakukan
        // di renderGraph saat graphView dibuat, agar konsisten baik mode awal standard/detail).
        if (_persisted && _persisted.layoutDir === 'TB') {
            const _db = document.getElementById('layoutDirBtn');
            if (_db) _db.textContent = '⇅ TB';
        }
        renderFiles();
        renderMergedYaml();
        // Simpan state ketika akan ditutup/hidden.
        window.addEventListener('beforeunload', function () { try { persistState(); } catch (e) {} });
    </script>
